<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F0E6;
    --paper-elevated: #FAF6EE;
    --paper-deep: #EAE2D3;
    --ink: #171614;
    --ink-soft: #4F4B44;
    --ink-muted: #8C857A;
    --vermilion: #DF3E26;
    --vermilion-deep: #B52A15;
    --ochre: #E3A024;
    --ochre-soft: #F3D18A;
    --cobalt: #1E5AA8;
    --sage: #387D64;
    --border-thick: 2.5px;
    --border-thin: 1.5px;
    --shadow-hard: 5px 5px 0px #171614;
    --shadow-sm: 3px 3px 0px #171614;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    touch-action: none;
  }

  #game-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--paper);
  }

  canvas#world {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  /* Tactile paper grain & subtle print vignette */
  .paper-grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0.34;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.24'/%3E%3C/svg%3E");
  }

  .print-frame {
    position: absolute;
    inset: 10px;
    border: 1.5px solid rgba(23, 22, 20, 0.22);
    pointer-events: none;
    z-index: 5;
  }

  .print-frame::before, .print-frame::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid var(--ink);
  }
  .print-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .print-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  /* HUD */
  #hud {
    position: absolute;
    top: 22px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 12;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  #hud.hidden {
    opacity: 0;
    transform: translateY(-10px);
  }

  .hud-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .hud-card {
    background: var(--paper-elevated);
    border: var(--border-thick) solid var(--ink);
    box-shadow: var(--shadow-sm);
    padding: 7px 14px;
    display: flex;
    flex-direction: column;
    min-width: 96px;
  }

  .hud-label {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .hud-value {
    font-family: 'Archivo Black', sans-serif;
    font-size: 24px;
    line-height: 1.05;
    color: var(--ink);
    margin-top: 2px;
  }

  .hud-value.vermilion { color: var(--vermilion); }
  .hud-value.ochre { color: #B8790C; }

  /* Overdrive Gauge */
  .overdrive-card {
    background: var(--paper-elevated);
    border: var(--border-thick) solid var(--ink);
    box-shadow: var(--shadow-sm);
    padding: 7px 12px;
    min-width: 158px;
  }

  .overdrive-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }

  .od-segments {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    height: 10px;
  }

  .od-seg {
    background: var(--paper-deep);
    border: 1px solid var(--ink);
    transition: background-color 0.15s ease, transform 0.15s ease;
  }

  .od-seg.filled {
    background: var(--ochre);
  }

  .od-seg.fever {
    background: var(--vermilion);
    animation: pulseSeg 0.35s infinite alternate;
  }

  @keyframes pulseSeg {
    from { transform: scaleY(0.85); }
    to { transform: scaleY(1.15); }
  }

  /* Buttons */
  .btn-swiss {
    pointer-events: auto;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: var(--paper-elevated);
    color: var(--ink);
    border: var(--border-thick) solid var(--ink);
    box-shadow: var(--shadow-sm);
    padding: 9px 14px;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.12s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .btn-swiss:hover {
    background: var(--paper-deep);
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0px var(--ink);
  }

  .btn-swiss:active {
    transform: translate(3px, 3px);
    box-shadow: 0px 0px 0px var(--ink);
  }

  .btn-primary {
    background: var(--vermilion);
    color: #FFFBF4;
    font-family: 'Archivo Black', sans-serif;
    font-size: 16px;
    letter-spacing: 0.06em;
    padding: 15px 28px;
    box-shadow: var(--shadow-hard);
  }

  .btn-primary:hover {
    background: #C9321B;
    box-shadow: 6px 6px 0px var(--ink);
  }

  /* Overlay Screens */
  .overlay-backdrop {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(245, 240, 230, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.25s ease;
  }

  .overlay-backdrop.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Main Menu Hub Card */
  .hub-shell {
    width: 100%;
    max-width: 780px;
    max-height: 90vh;
    background: var(--paper-elevated);
    border: 3px solid var(--ink);
    box-shadow: 10px 10px 0px var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: cardEnter 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Top Masthead */
  .hub-masthead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    border-bottom: var(--border-thick) solid var(--ink);
    background: var(--paper);
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand-lockup {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .brand-title span {
    color: var(--vermilion);
  }

  .brand-sub {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .ink-wallet {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-elevated);
    border: 2px solid var(--ink);
    padding: 6px 12px;
    box-shadow: 2px 2px 0px var(--ink);
  }

  .ink-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--ochre);
    border: 2px solid var(--ink);
  }

  .ink-amount {
    font-family: 'Archivo Black', sans-serif;
    font-size: 15px;
  }

  /* Navigation Tabs */
  .hub-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: var(--border-thick) solid var(--ink);
    background: var(--paper-deep);
  }

  .hub-tab {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 8px;
    border: none;
    border-right: 2px solid var(--ink);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .hub-tab:last-child { border-right: none; }

  .hub-tab:hover {
    background: rgba(255, 255, 255, 0.45);
    color: var(--ink);
  }

  .hub-tab.active {
    background: var(--paper-elevated);
    color: var(--ink);
    box-shadow: inset 0 -4px 0 var(--vermilion);
  }

  .tab-badge {
    background: var(--vermilion);
    color: #fff;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 99px;
  }

  /* Tab Body */
  .hub-body {
    padding: 22px;
    overflow-y: auto;
    flex: 1;
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
    animation: fadePanel 0.2s ease;
  }

  @keyframes fadePanel {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* PLAY TAB */
  .play-hero {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 20px;
    align-items: stretch;
  }

  @media (max-width: 660px) {
    .play-hero { grid-template-columns: 1fr; }
  }

  .editorial-pitch {
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
  }

  .editorial-kicker {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--vermilion);
  }

  .editorial-headline {
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    line-height: 1.08;
    color: var(--ink);
    margin-top: 4px;
  }

  .mechanic-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1.5px solid rgba(23,22,20,0.2);
    padding-top: 12px;
  }

  .mechanic-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .mech-tag {
    font-weight: 700;
    font-size: 10px;
    padding: 2px 6px;
    border: 1.5px solid var(--ink);
    background: var(--paper-elevated);
    color: var(--ink);
    min-width: 66px;
    text-align: center;
  }

  .launch-box {
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
  }

  .stat-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .mini-stat {
    background: var(--paper-elevated);
    border: 1.5px solid var(--ink);
    padding: 10px;
  }

  .mini-stat-label {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }

  .mini-stat-val {
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    margin-top: 2px;
  }

  /* ATELIER TAB */
  .atelier-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 18px;
  }

  @media (max-width: 660px) {
    .atelier-layout { grid-template-columns: 1fr; }
  }

  .preview-stage-box {
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  canvas#atelier-preview {
    width: 100%;
    height: 180px;
    border: 1.5px solid var(--ink);
    background: var(--paper
